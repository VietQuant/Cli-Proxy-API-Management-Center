server {
    # Unprivileged nginx cannot bind ports below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes probes; kept out of the access log to avoid drowning it.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Single-page app: unknown paths are client-side routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The HTML embeds its own assets and is republished on every deploy, so it
    # must never be served from cache.
    location ~* \.html$ {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
